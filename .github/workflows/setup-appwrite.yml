name: Setup Appwrite (Database + Site + Profils)

# ============================================================
# Ce workflow configure entièrement Appwrite à chaque push sur
# la branche main.
#
# Il exécute:
#   1. setup-appwrite.ts : crée database + 12 collections + 4 buckets
#   2. configure-site.ts : configure les variables du site Appwrite Sites
#   3. seed-directory.ts : crée les 839 profils utilisateurs
#
# Pour activer ce workflow, vous devez configurer les SECRETS GitHub
# suivants (Settings > Secrets and variables > Actions):
#
#   - APPWRITE_API_KEY       : clé API Appwrite avec les scopes:
#                              databases.*, collections.*, attributes.*,
#                              users.*, storage.*, sites.*, sites.variables.*
#   - APPWRITE_SITE_ID       : ID du site Appwrite Sites (optionnel la 1ère fois)
#   - APPWRITE_DEFAULT_PASSWORD : mot de passe temporaire des profils (optionnel)
#
# Voir SETUP.md pour le guide complet.
# ============================================================

on:
  push:
    branches: [main]
  workflow_dispatch:  # permet de déclencher manuellement depuis GitHub

# Stop les runs précédents si un nouveau push arrive
concurrency:
  group: appwrite-setup-${{ github.ref }}
  cancel-in-progress: false  # on ne cancel pas, c'est destructeur

jobs:
  setup:
    name: Configure Appwrite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Ne lance pas le job si APPWRITE_API_KEY n'est pas configuré
    if: ${{ github.event_name == 'workflow_dispatch' || true }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Type check
        run: npm run check

      - name: 🏗️ Build
        run: npm run build
        env:
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID || '68fceae4001cf61101d4' }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID || 'codet-db' }}

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-public
          path: dist/public/
          retention-days: 7
          if-no-files-found: error

      # ===== ÉTAPE 1: Configuration database + collections + buckets =====
      - name: 🗄️ Configure database + collections + buckets
        if: ${{ secrets.APPWRITE_API_KEY != '' }}
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID || '68fceae4001cf61101d4' }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID || 'codet-db' }}
        run: npm run appwrite:setup

      # ===== ÉTAPE 2: Configuration des variables du site =====
      - name: 🌐 Configure Appwrite Sites variables
        if: ${{ secrets.APPWRITE_API_KEY != '' && vars.APPWRITE_SITE_ID != '' }}
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_SITE_ID: ${{ vars.APPWRITE_SITE_ID }}
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID || '68fceae4001cf61101d4' }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID || 'codet-db' }}
        run: npm run appwrite:site

      # ===== ÉTAPE 3: Création des 839 profils utilisateurs =====
      - name: 👥 Seed 839 profils utilisateurs
        if: ${{ secrets.APPWRITE_API_KEY != '' }}
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DEFAULT_PASSWORD: ${{ secrets.APPWRITE_DEFAULT_PASSWORD || 'CodetTchoutsi2025!' }}
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID || '68fceae4001cf61101d4' }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID || 'codet-db' }}
        run: npm run appwrite:seed

      # ===== Récapitulatif =====
      - name: 📊 Récapitulatif
        if: always()
        run: |
          echo "=============================================="
          echo "  Configuration Appwrite terminée"
          echo "=============================================="
          echo ""
          echo "Prochaines étapes:"
          echo "  1. Vérifiez le déploiement Appwrite Sites dans la Console"
          echo "  2. Ajoutez le domaine du site dans Auth > Web platforms"
          echo "  3. Testez la connexion avec un compte créé"
          echo ""
          if [ -n "${{ secrets.APPWRITE_API_KEY }}" ]; then
            echo "✅ APPWRITE_API_KEY: configuré"
          else
            echo "❌ APPWRITE_API_KEY: MANQUANT"
            echo "   → Configurez le secret GitHub (voir SETUP.md)"
          fi
