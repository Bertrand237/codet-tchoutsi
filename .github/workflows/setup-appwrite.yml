name: Setup Appwrite (Automatic Deployment)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet aussi le déclenchement manuel

jobs:
  setup:
    name: Configure Appwrite Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: ⚙️ Configure Appwrite (Database + Collections + Buckets)
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID || '68fceae4001cf61101d4' }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID || 'codet-db' }}
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "❌ ERREUR: APPWRITE_API_KEY non configuré dans les secrets GitHub."
            exit 1
          fi
          npx ts-node scripts/setup-appwrite.ts

      - name: 👥 Seed Directory (Optionnel - Idempotent)
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID || '68fceae4001cf61101d4' }}
        run: |
          if [ -f "scripts/seed-directory.ts" ]; then
            npx ts-node scripts/seed-directory.ts || echo "Seed skipped or failed"
          fi
