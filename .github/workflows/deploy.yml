name: Deploy CODET

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  full-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Passage à Node 24 pour supprimer l'avertissement
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure Appwrite Infrastructure
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          echo "✅ Secret détecté, lancement de la configuration..."
          node scripts/setup-appwrite.mjs

      - name: Seed Member Profiles
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -f "scripts/seed-directory.mjs" ]; then
            node scripts/seed-directory.mjs || echo "⚠️ Seed ignoré ou échoué."
          fi

      - name: Build Frontend
        run: npm run build

      - name: Check output directory
        run: ls -R dist/public
