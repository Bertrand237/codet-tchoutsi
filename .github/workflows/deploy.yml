name: Deploy CODET

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  full-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure Appwrite Infrastructure
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          echo "🔍 Vérification du secret..."
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "❌ ERREUR CRITIQUE : Le secret APPWRITE_API_KEY est vide ou introuvable sur GitHub."
            echo "Veuillez vérifier dans Settings > Secrets and variables > Actions."
            exit 1
          else
            echo "✅ Secret détecté, lancement de la configuration..."
            node scripts/setup-appwrite.mjs
          fi

      - name: Seed Member Profiles
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -f "scripts/seed-directory.mjs" ]; then
            node scripts/seed-directory.mjs || echo "⚠️ Seed ignoré ou échoué."
          fi

      - name: Build Frontend
        run: npm run build
