name: Deploy CODET

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  full-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Utilisation de Node 24 pour éviter les erreurs de dépréciation
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure Appwrite Infrastructure
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "❌ ERREUR: Secret APPWRITE_API_KEY manquant sur GitHub."
            exit 1
          fi
          npm run appwrite:setup

      - name: Seed Member Profiles
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: npm run appwrite:seed || echo "Seed skipped"

      - name: Build Frontend
        run: npm run build
